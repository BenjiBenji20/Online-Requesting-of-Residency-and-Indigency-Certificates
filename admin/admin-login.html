<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login As Google</title>
  <link rel="icon" href="../images/barangays.png">
  <style>
   body {
      background-image: url('../images/hall.jpg');
      background-size: cover;        /* Make the image cover the entire screen */
      background-position: center;   /* Center the background image */
      background-repeat: no-repeat; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: Arial;
    }
    .btn {
      display: flex;
      align-items: center;
      background-color: white;
      border: none;
      padding: 20px 40px; 
      font-size: 24px; 
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 8px; 
    }
    .btn img {
      width: 35px; 
      height: 35px;
      margin-right: 15px;
    }
    .line {
      width: 2px;
      height: 32px;
      background-color: black;
      margin: 0 15px;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(232, 223, 127, 0.7); 
      width: 100%;
      padding: 20px;
    }

    .container > h1 {
      color: white;
      font-size: 3rem;
    }

    .button-container {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Online Requesting of Document in Barangay Santulan</h1>

    <div class="button-container">
      <button class="btn">
        <img src="/images/google.jpg" alt="logo">
        <div class="line"></div>
        LOGIN AS GOOGLE
      </button>
    </div>
  </div>

  <script src="/admin/test/admin-login-test.js"></script>
</body>
</html>
