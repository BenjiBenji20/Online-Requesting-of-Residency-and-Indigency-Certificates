<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resident Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <form id="registrationForm">
    <h2>Resident Registration</h2>

    <div class="mb-3">
      <label for="nationalId" class="form-label">National ID</label>
      <input type="number" class="form-control" id="nationalId" required>
    </div>

    <div class="mb-3">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" id="firstName" required>
    </div>

    <div class="mb-3">
      <label for="middleName" class="form-label">Middle Name</label>
      <input type="text" class="form-control" id="middleName">
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lastName" required>
    </div>

    <div class="mb-3">
      <label for="suffix" class="form-label">Suffix (Optional)</label>
      <input type="text" class="form-control" id="suffix">
    </div>

    <div class="mb-3">
      <label for="age" class="form-label">Age</label>
      <input type="number" class="form-control" id="age" required>
    </div>

    <div class="mb-3">
      <label for="gender" class="form-label">Gender</label>
      <select class="form-control" id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Civil Status</label>
      <select class="form-control" id="status" required>
        <option value="">Select Status</option>
        <option value="SINGLE">Single</option>
        <option value="MARRIED">Married</option>
        <option value="WIDOWED">Widowed</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="completeAddress" class="form-label">Complete Address</label>
      <textarea class="form-control" id="completeAddress" rows="2" required></textarea>
    </div>

    <div class="mb-3">
      <label for="birthDate" class="form-label">Birth Date</label>
      <input type="date" class="form-control" id="birthDate" required>
    </div>

    <div class="mb-3">
      <label for="purpose" class="form-label">Purpose</label>
      <select class="form-control" id="purpose" required>
        <option value="">Select Purpose</option>
        <option value="WORK">WORK</option>
        <option value="SCHOOL">SCHOOL</option>
        <option value="MEDICAL">MEDICAL</option>
        <option value="BUSINESS">BUSINESS</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="contactNumber" class="form-label">Contact Number</label>
      <input type="text" class="form-control" id="contactNumber" required>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<script>
  document.getElementById('registrationForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const payload = {
      nationalId: Number(document.getElementById('nationalId').value),
      firstName: document.getElementById('firstName').value,
      middleName: document.getElementById('middleName').value,
      lastName: document.getElementById('lastName').value,
      suffix: document.getElementById('suffix').value || '',
      age: Number(document.getElementById('age').value),
      gender: document.getElementById('gender').value,
      status: document.getElementById('status').value,
      completeAddress: document.getElementById('completeAddress').value,
      birthDate: document.getElementById('birthDate').value,
      purpose: document.getElementById('purpose').value,
      contactNumber: document.getElementById('contactNumber').value
    };

    try {
      const response = await fetch('http://localhost:8081/api/santulan/residents/public/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert('Registration successful!');
        document.getElementById('registrationForm').reset();
      } else {
        const error = await response.json();
        alert('Error: ' + JSON.stringify(error));
      }
    } catch (err) {
      console.error('Fetch error:', err);
      alert('Unable to connect to the server.');
    }
  });
</script>
</body>
</html>
